# PLDN-FAYL: .github/workflows/build.yml | versiya: bozor-ci-1.0 | satr: 46 | 14-noy-2026
name: Build PLDN Bozor APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Web files
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Version
        run: |
          VN=$(grep '^versionName=' version.txt | cut -d= -f2)
          VC=$(grep '^versionCode=' version.txt | cut -d= -f2)
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PLDN-Bozor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
